<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F Blok – 3B Cephe Renk Stüdyosu</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#9db6d6;font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#eceef1}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
#ui{position:fixed;top:12px;right:12px;width:316px;max-height:calc(100vh - 24px);display:flex;flex-direction:column;background:rgba(22,24,29,.80);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.10);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.35);overflow:hidden}
.hdr{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.hdr b{font-size:15px;letter-spacing:.2px}
.hdr span{opacity:.6;font-size:12px;flex:1}
.hdr button{background:none;border:0;color:#fff;font-size:16px;cursor:pointer;padding:2px 6px;opacity:.8}
.body{overflow:auto;padding:4px 14px 14px}
.body.hide{display:none}
section{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07)}
section:last-child{border:0}
h3{margin:0 0 8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.9px;opacity:.55}
.row{display:flex;align-items:center;gap:10px;padding:4px 6px;margin:0 -6px;border-radius:8px;transition:background .3s}
.row.flash{background:rgba(255,255,255,.18)}
.row label{flex:1;cursor:pointer}
.row code{font:11px ui-monospace,Menlo,monospace;opacity:.55;width:58px;text-align:right}
input[type=color]{-webkit-appearance:none;appearance:none;width:30px;height:30px;border:2px solid rgba(255,255,255,.35);border-radius:50%;padding:0;background:none;cursor:pointer;overflow:hidden}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
input[type=color]::-moz-color-swatch{border:0;border-radius:50%}
#pal{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.chip{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:9px;background:rgba(255,255,255,.07);border:1px solid transparent;cursor:pointer;color:inherit;font:inherit;text-align:left}
.chip:hover{background:rgba(255,255,255,.14)}
.chip i{display:flex;flex:none;width:34px;height:16px;border-radius:5px;overflow:hidden}
.chip i s{flex:1}
.btn{width:100%;padding:8px;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:inherit;font:inherit;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.16)}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.btns .btn{padding:7px 4px;font-size:12px}
.tg{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.tg input{accent-color:#e8a15a;width:16px;height:16px}
input[type=range]{width:100%;accent-color:#e8a15a}
.sl{display:flex;justify-content:space-between;opacity:.8;margin-bottom:2px}
#tip{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:8px 14px;background:rgba(20,22,26,.82);border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;backdrop-filter:blur(8px)}
#hint{position:fixed;left:16px;bottom:14px;font-size:12px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);opacity:.85;pointer-events:none}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f1216;color:#fff;font-size:15px;z-index:9;transition:opacity .6s}
@media(max-width:720px){#ui{top:auto;bottom:0;right:0;left:0;width:auto;max-height:46vh;border-radius:14px 14px 0 0}#hint{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="load">Model hazırlanıyor…</div>
<div id="ui">
  <div class="hdr"><b>F Blok</b><span>3B Cephe Renk Stüdyosu</span><button id="fold" title="Paneli daralt">▾</button></div>
  <div class="body" id="body">
    <section>
      <h3>Hazır paletler</h3>
      <div id="pal"></div>
      <button class="btn" id="rnd">Rastgele uyumlu palet üret</button>
    </section>
    <section>
      <h3>Cephe renkleri</h3>
      <div id="rows"></div>
    </section>
    <section>
      <h3>Işık</h3>
      <div class="sl"><span>Günün saati</span><span id="tv">14:30</span></div>
      <input type="range" id="time" min="6.5" max="18.5" step="0.05" value="15.3">
    </section>
    <section>
      <h3>Sahne</h3>
      <div id="tgs"></div>
    </section>
    <section>
      <h3>Kamera</h3>
      <div class="btns" id="cams"></div>
    </section>
    <section><button class="btn" id="reset">Fotoğraftaki orijinal renklere dön</button></section>
  </div>
</div>
<div id="hint">Sürükle: döndür · Sağ tık / Shift+sürükle: kaydır · Tekerlek: yakınlaş · Cepheye tıkla: o yüzeyin rengini seç</div>
<div id="tip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){document.getElementById('load').textContent='Three.js yüklenemedi (ağ erişimi).';return;}
const T=THREE;
const $=id=>document.getElementById(id);
const canvas=$('c');
let renderer;
try{renderer=new T.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});}
catch(e){$('load').textContent='WebGL başlatılamadı.';return;}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
renderer.outputEncoding=T.sRGBEncoding;
renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
const scene=new T.Scene();
const camera=new T.PerspectiveCamera(62,1,.3,2000);
const ANISO=renderer.capabilities.getMaxAnisotropy();

/* ---------- yardımcılar ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rg=mulberry32(20261123);
const cv=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
function tex(c,rep){const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=ANISO;t.encoding=T.sRGBEncoding;t.repeat.set(rep,rep);return t}
function lin(hex){const c=new T.Color(hex);c.convertSRGBToLinear();return c}
function setC(m,hex){m.color.set(hex);m.color.convertSRGBToLinear()}

/* ---------- birleştirme (draw call azaltma) ---------- */
function merge(list){
  let nv=0,ni=0;const col=!!list[0].attributes.color;
  for(const g of list){nv+=g.attributes.position.count;ni+=g.index?g.index.count:g.attributes.position.count}
  const P=new Float32Array(nv*3),N=new Float32Array(nv*3),U=new Float32Array(nv*2),C=col?new Float32Array(nv*3):null,X=new Uint32Array(ni);
  let vo=0,io=0;
  for(const g of list){
    const a=g.attributes,c=a.position.count;
    P.set(a.position.array,vo*3);N.set(a.normal.array,vo*3);
    if(a.uv)U.set(a.uv.array,vo*2);
    if(col)C.set(a.color.array,vo*3);
    if(g.index){const ix=g.index.array;for(let i=0;i<ix.length;i++)X[io+i]=ix[i]+vo;io+=ix.length}
    else{for(let i=0;i<c;i++)X[io+i]=vo+i;io+=c}
    vo+=c;
  }
  const o=new T.BufferGeometry();
  o.setAttribute('position',new T.BufferAttribute(P,3));
  o.setAttribute('normal',new T.BufferAttribute(N,3));
  o.setAttribute('uv',new T.BufferAttribute(U,2));
  if(col)o.setAttribute('color',new T.BufferAttribute(C,3));
  o.setIndex(new T.BufferAttribute(X,1));
  return o;
}
class Batch{
  constructor(){this.m=new Map()}
  add(g,mat,M){if(M)g.applyMatrix4(M);let l=this.m.get(mat);if(!l)this.m.set(mat,l=[]);l.push(g)}
  build(parent,cast=true){
    const out=[];
    this.m.forEach((l,mat)=>{const mesh=new T.Mesh(merge(l),mat);mesh.castShadow=cast&&!mat.transparent;mesh.receiveShadow=true;parent.add(mesh);out.push(mesh)});
    return out;
  }
}
function bgeo(w,h,d){
  const g=new T.BoxGeometry(w,h,d),uv=g.attributes.uv;
  const dm=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for(let f=0;f<6;f++)for(let v=0;v<4;v++){const i=f*4+v;uv.setXY(i,uv.getX(i)*dm[f][0],uv.getY(i)*dm[f][1])}
  return g;
}
function bx(B,mat,x0,x1,y0,y1,z0,z1,M){
  const g=bgeo(x1-x0,y1-y0,z1-z0);
  const m=new T.Matrix4().makeTranslation((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);
  if(M)m.premultiply(M);
  B.add(g,mat,m);
}
function bxS(B,mat,s,x0,x1,y0,y1,z0,z1){const a=s*x0,b=s*x1;bx(B,mat,Math.min(a,b),Math.max(a,b),y0,y1,z0,z1)}
const CYL=new T.CylinderGeometry(1,1,1,10),CYL6=new T.CylinderGeometry(1,1,1,6),SPH=new T.SphereGeometry(1,10,7);
function cyl(B,mat,x,y,z,rt,rb,h,M){
  const g=(rt===rb?CYL:new T.CylinderGeometry(rt,rb,1,10)).clone();
  const s=rt===rb?new T.Matrix4().makeScale(rt,h,rt):new T.Matrix4().makeScale(1,h,1);
  const m=new T.Matrix4().makeTranslation(x,y,z).multiply(s);
  if(M)m.premultiply(M);
  B.add(g,mat,m);
}
function sph(B,mat,x,y,z,rx,ry,rz){B.add(SPH.clone(),mat,new T.Matrix4().makeTranslation(x,y,z).multiply(new T.Matrix4().makeScale(rx,ry||rx,rz||rx)))}
function quad(B,mat,p,n,uv){
  const g=new T.BufferGeometry();
  g.setAttribute('position',new T.Float32BufferAttribute(p.flat(),3));
  g.setAttribute('normal',new T.Float32BufferAttribute([...n,...n,...n,...n],3));
  g.setAttribute('uv',new T.Float32BufferAttribute(uv.flat(),2));
  g.setIndex([0,1,2,0,2,3]);B.add(g,mat);
}
function tri(B,mat,p,n,uv){
  const g=new T.BufferGeometry();
  g.setAttribute('position',new T.Float32BufferAttribute(p.flat(),3));
  g.setAttribute('normal',new T.Float32BufferAttribute([...n,...n,...n],3));
  g.setAttribute('uv',new T.Float32BufferAttribute(uv.flat(),2));
  g.setIndex([0,1,2]);B.add(g,mat);
}

function stuccoCanvas(){
  const c=cv(512,512),g=c.getContext('2d');
  g.fillStyle='#f0f0f0';g.fillRect(0,0,512,512);
  for(let i=0;i<5000;i++){const v=225+Math.random()*30|0;g.fillStyle=`rgba(${v},${v},${v},.45)`;g.fillRect(Math.random()*512,Math.random()*512,1+Math.random()*3,1+Math.random()*3)}
  for(let i=0;i<900;i++){g.fillStyle='rgba(110,100,90,.06)';g.fillRect(Math.random()*512,Math.random()*512,1+Math.random()*2,1+Math.random()*2)}
  for(let i=0;i<46;i++){const x=Math.random()*512;g.fillStyle=`rgba(80,70,60,${.006+Math.random()*.016})`;g.fillRect(x,0,1+Math.random()*5,512)}
  return c;
}
function tileCanvas(){
  const c=cv(512,512),g=c.getContext('2d');
  g.fillStyle='#4a4a4a';g.fillRect(0,0,512,512);
  const tw=128,th=128;
  for(let r=0;r<4;r++)for(let k=-1;k<5;k++){
    const x=k*tw+(r%2?tw/2:0),y=r*th,v=190+Math.random()*60|0;
    const gr=g.createLinearGradient(0,y,0,y+th);
    gr.addColorStop(0,`rgb(${v},${v},${v})`);gr.addColorStop(.8,`rgb(${v-30},${v-30},${v-30})`);gr.addColorStop(1,'rgb(70,70,70)');
    g.fillStyle=gr;g.fillRect(x+3,y+2,tw-6,th-6);
    for(let q=1;q<4;q++){g.fillStyle='rgba(0,0,0,.28)';g.fillRect(x+q*tw/4-1,y+4,3,th-12);g.fillStyle='rgba(255,255,255,.22)';g.fillRect(x+q*tw/4+2,y+4,2,th-12)}
    g.fillStyle='rgba(0,0,0,.35)';g.fillRect(x+3,y+th-9,tw-6,4);
  }
  for(let i=0;i<2200;i++){g.fillStyle='rgba(30,30,20,.09)';g.fillRect(Math.random()*512,Math.random()*512,1+Math.random()*6,1+Math.random()*6)}
  for(let i=0;i<500;i++){g.fillStyle='rgba(150,160,110,.12)';g.fillRect(Math.random()*512,Math.random()*512,2+Math.random()*7,2+Math.random()*5)}
  return c;
}

  g.fillStyle='rgba(0,0,0,.25)';g.fillRect(0,30,512,3);g.fillRect(0,286,512,3);g.fillRect(120,0,3,512);g.fillRect(376,0,3,512);

  for(let i=0;i<5000;i++){g.fillStyle=`rgba(${Math.random()<.5?'0,0,0':'255,255,255'},.06)`;g.fillRect(Math.random()*512,Math.random()*512,1+Math.random()*3,1+Math.random()*3)}

function grassCanvas(){
  const c=cv(512,512),g=c.getContext('2d'),P=PHOTO.gpal;
  g.fillStyle=P[0];g.fillRect(0,0,512,512);
  const wrapDraw=(f)=>{for(const dx of[-512,0,512])for(const dy of[-512,0,512])f(dx,dy)};
  for(let i=0;i<60;i++){const x=Math.random()*512,y=Math.random()*512,r=25+Math.random()*60;g.fillStyle=P[(Math.random()*P.length)|0];
    wrapDraw((dx,dy)=>{g.globalAlpha=.35;g.beginPath();g.arc(x+dx,y+dy,r,0,7);g.fill()})}
  g.globalAlpha=1;
  for(let i=0;i<26000;i++){const x=Math.random()*512,y=Math.random()*512,l=2+Math.random()*7;g.strokeStyle=P[(Math.random()*P.length)|0];g.globalAlpha=.55;g.lineWidth=1;
    wrapDraw((dx,dy)=>{g.beginPath();g.moveTo(x+dx,y+dy);g.lineTo(x+dx+(Math.random()-.5)*3,y+dy-l);g.stroke()})}
  g.globalAlpha=1;
  for(let i=0;i<800;i++){g.fillStyle=`rgba(${160+Math.random()*50|0},${120+Math.random()*40|0},60,.25)`;g.fillRect(Math.random()*512,Math.random()*512,1+Math.random()*2,1+Math.random()*3)}
  return c;
}

}
function flagCanvas(){
  const c=cv(300,450),g=c.getContext('2d');
  g.translate(300,0);g.rotate(Math.PI/2);
  g.fillStyle='#e30a17';g.fillRect(0,0,450,300);
  g.fillStyle='#fff';g.beginPath();g.arc(180,150,75,0,7);g.fill();
  g.fillStyle='#e30a17';g.beginPath();g.arc(205,150,60,0,7);g.fill();
  g.fillStyle='#fff';g.beginPath();
  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?16:40;g.lineTo(265+Math.cos(a)*r,150+Math.sin(a)*r)}
  g.closePath();g.fill();
  return c;
}
function signCanvas(t){
  const c=cv(256,80),g=c.getContext('2d');
  g.fillStyle='#e9e3d4';g.fillRect(0,0,256,80);g.strokeStyle='#555';g.lineWidth=4;g.strokeRect(3,3,250,74);
  g.fillStyle='#333';g.font='bold 44px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(t,128,42);
  return c;
}

const P_ORG=PMAT[0],P_BLU=PMAT[1],P_TARP=PMAT[2],P_BOX=PMAT[3],P_PLANT=PMAT[4],P_POT=PMAT[5],P_SHEET=PMAT[6],P_RED=PMAT[7],P_GREY=PMAT[8],P_CREAM=PMAT[9],P_WOOD=PMAT[10],P_MINT=PMAT[11];

/* ---------- pencere / kapı ---------- */
function win(B,S,x,yb,z,rot,w,h,o){
  o=o||{};
  const Mx=new T.Matrix4().makeRotationY(rot);Mx.setPosition(x,yb,z);
  const fm=o.frame||S.frame,t=o.door?.06:.07,hw=w/2;
  const P=(x0,x1,y0,y1,z0,z1,m)=>bx(B,m,x0,x1,y0,y1,z0,z1,Mx);
  P(-hw+t,hw-t,t,h-t,.0005,.0015,S.interior);
  if(!o.noCurtain&&rg()<.85){
    const f=.3+rg()*.7,cm=CURT[(rg()*CURT.length)|0];
    P(-hw+t+.01,hw-t-.01,h-t-f*(h-2*t),h-t,.002,.004,cm);
  }
  P(-hw+t,hw-t,t,h-t,.006,.012,S.glass);
  P(-hw,-hw+t,0,h,0,.1,fm);P(hw-t,hw,0,h,0,.1,fm);
  P(-hw+t,hw-t,h-t,h,0,.1,fm);P(-hw+t,hw-t,0,t,0,.1,fm);
  if(w>.85)P(-.03,.03,t,h-t,0,.1,fm);
  if(h>1.9)P(-hw+t,hw-t,h*.7,h*.7+.05,0,.1,fm);
  if(!o.door)P(-hw-.07,hw+.07,-.05,0,0,.24,fm);
}

/* ---------- balkon aksesuarları ---------- */
function balconyProps(BP,BD,s,y0,xa,xb,ZF,R){
  const n=1+((R()*3)|0);
  const taken=[];
  const free=(x,w)=>{for(const t of taken)if(Math.abs(t[0]-x)<(t[1]+w)/2+.1)return false;return true};
  for(let k=0;k<n;k++){
    const type=(R()*8)|0,x=xa+1+R()*(xb-xa-2);
    const X=(dx)=>s*(x+dx);
    if(type===0&&free(x,1.6)){taken.push([x,1.6]);
      bx(BP,P_WOOD,Math.min(X(-.3),X(.3)),Math.max(X(-.3),X(.3)),y0+.68,y0+.72,ZF+.5,ZF+1.0);
      cyl(BP,P_WOOD,X(0),y0+.34,ZF+.75,.04,.04,.68);
      for(const dx of[-.75,.75]){
        const cx=X(dx);bx(BP,k%2?P_ORG:P_BLU,cx-.2,cx+.2,y0+.42,y0+.46,ZF+.55,ZF+.95);
        bx(BP,k%2?P_ORG:P_BLU,cx-.2,cx+.2,y0+.46,y0+.9,ZF+.93,ZF+.97);
        for(const [lx,lz] of[[-.18,.57],[.18,.57],[-.18,.93],[.18,.93]])bx(BP,P_GREY,cx+lx-.015,cx+lx+.015,y0,y0+.42,ZF+lz-.015,ZF+lz+.015);
      }
    }else if(type===1&&free(x,2.2)){taken.push([x,2.2]);
      for(let q=0;q<4;q++){const px=X(-.9+q*.6),pz=ZF+.45+R()*.7,r=.14+R()*.08;
        cyl(BP,P_POT,px,y0+.13,pz,r,r*.75,.26);sph(BP,P_PLANT,px,y0+.42,pz,r*1.5,r*1.4,r*1.5)}
    }else if(type===2&&free(x,2.6)){taken.push([x,2.6]);
      bx(BP,P_TARP,Math.min(X(-1.3),X(1.3)),Math.max(X(-1.3),X(1.3)),y0,y0+.55,ZF+.35,ZF+1.15);
      bx(BP,P_TARP,Math.min(X(-.6),X(.8)),Math.max(X(-.6),X(.8)),y0+.55,y0+.8,ZF+.45,ZF+1.0);
    }else if(type===3&&free(x,1.5)){taken.push([x,1.5]);
      for(const dx of[-.65,.65]){const px=X(dx);bx(BP,P_WHITE,px-.02,px+.02,y0,y0+1.25,ZF+.4,ZF+.44);bx(BP,P_WHITE,px-.02,px+.02,y0,y0+1.25,ZF+1.1,ZF+1.14)}
      bx(BP,P_WHITE,Math.min(X(-.65),X(.65)),Math.max(X(-.65),X(.65)),y0+1.2,y0+1.25,ZF+.4,ZF+1.14);
      const cl=[P_RED,P_BLU,P_CREAM,P_MINT];
      for(let q=0;q<4;q++){const px=X(-.5+q*.33);bx(BP,cl[q%4],px-.1,px+.1,y0+.5,y0+1.2,ZF+.75,ZF+.78)}
    }else if(type===4&&free(x,1.5)){taken.push([x,1.5]);
      const a=Math.min(X(-.7),X(.7)),b=Math.max(X(-.7),X(.7));
      bx(BP,P_SHEET,a,b,y0+.05,y0+1.0,ZF+1.46,ZF+1.48);
    }else if(type===5&&free(x,1)){taken.push([x,1]);
      bx(BP,P_WHITE,Math.min(X(-.42),X(.42)),Math.max(X(-.42),X(.42)),y0,y0+.6,ZF+.4,ZF+.75);
      cyl(BP,P_GREY,X(0),y0+.3,ZF+.76,.2,.2,.02,new T.Matrix4().makeRotationX(Math.PI/2));
    }else if(type===6&&free(x,1.2)){taken.push([x,1.2]);
      for(let q=0;q<3;q++){const px=X(-.35+q*.35);bx(BP,P_BOX,Math.min(px-.17,px+.17),Math.max(px-.17,px+.17),y0,y0+.35+R()*.2,ZF+.5,ZF+.85)}
    }else if(type===7&&free(x,1.2)){taken.push([x,1.2]);
      bx(BP,P_MINT,Math.min(X(-.2),X(.2)),Math.max(X(-.2),X(.2)),y0,y0+.45,ZF+.5,ZF+.9);
      sph(BP,P_PLANT,X(0),y0+.7,ZF+.7,.3,.3,.3);
    }
  }
  if(R()<.35){ // uydu çanağı
    const px=s*(xa+.7+R()*(xb-xa-1.4)),pz=ZF+1.43,py=y0+1.12;
    const M1=new T.Matrix4().makeRotationX(Math.PI/2-.5);M1.setPosition(px,py+.2,pz+.1);
    const g=new T.CylinderGeometry(.34,.06,.05,16);BD.add(g,P_WHITE,M1);
    cyl(BD,P_GREY,px,py+.08,pz,.015,.015,.3);
  }
}

/* ---------- blok ---------- */
function buildBlock(S,seed,label,opts){
  const rng=mulberry32(seed),R=()=>rng();
  const G=new T.Group();
  const B=new Batch(),BP=new Batch(),BD=new Batch(),BRF=new Batch(),BT=new Batch(),BTD=new Batch();
  const FH=2.9,Y0=.5,NF=5,EAVE=Y0+NF*FH,ZB=-5.5,ZF=5.5,WX=15.3,TOP=EAVE+4.2;
  const out={group:G};

  // gövde
  bx(B,S.base,-WX-.05,WX+.05,0,.55,ZB-.05,ZF+.05);
  bx(B,S.wall,-WX,WX,.5,EAVE,ZB,ZF);
  // çekirdek / merdiven kulesi
  bx(B,S.wall,-2.3,2.3,.5,TOP-.8,ZB-.1,6.1);
  for(const s of[-1,1])bxS(B,S.accent,s,2.3,3,.5,TOP-.8,ZB-.1,6.4);
  bx(B,S.accent,-3.4,3.4,TOP-.8,TOP,ZB-.4,6.8);
  bx(B,S.fascia,-3.3,3.3,TOP-.95,TOP-.8,ZB-.3,6.7);
  // baca
  bx(B,S.wall,-2.6,-1.9,TOP,TOP+.9,-3.4,-2.7);bx(B,S.plinth,-2.7,-1.8,TOP+.9,TOP+1.05,-3.5,-2.6);
  bx(B,S.wall,1.8,2.5,TOP,TOP+.7,-1.4,-.7);bx(B,S.plinth,1.7,2.6,TOP+.7,TOP+.85,-1.5,-.6);
  cyl(B,S.rail,0,TOP+.7,-2,.02,.02,1.4);
  bx(B,S.metal,-2.7,-1.8,TOP+1.05,TOP+1.2,-3.5,-2.6);bx(B,S.metal,1.7,2.6,TOP+.85,TOP+1.0,-1.5,-.6);

  // giriş
  for(const [yb,h,d] of[[.5,2.2,0]]){win(B,S,0,yb,6.1,0,1.7,h,{door:true,frame:S.metal,noCurtain:true})}
  const steps=[[1.9,.17,8.0],[1.7,.34,7.6],[1.5,.5,7.2]];
  for(const [hw,hh,zz] of steps)bx(B,S.base,-hw-.4,hw+.4,0,hh,6.1,zz);
  for(const sx of[-1,1]){bx(B,S.fence,sx*2.35-.02,sx*2.35+.02,.5,1.35,6.3,8.0);bx(B,S.fence,sx*2.35-.02,sx*2.35+.02,1.3,1.35,6.3,8.0);for(let z=6.4;z<8;z+=.14)bx(B,S.fence,sx*2.35-.01,sx*2.35+.01,.5,1.3,z-.01,z+.01)}
  // giriş saçağı
  const Mc=new T.Matrix4().makeRotationX(.2);Mc.setPosition(0,3.45,7.1);
  const cg=bgeo(4.3,.14,2.4);cg.applyMatrix4(Mc);BT.add(cg,S.canopy);
  bx(B,S.fascia,-2.0,2.0,3.05,3.3,6.1,6.3);
  for(const sx of[-1,1])bx(B,S.accent,sx*1.95-.06,sx*1.95+.06,2.6,3.3,7.55,7.7);
  const sg=new T.Mesh(new T.PlaneGeometry(.75,.24),new T.MeshStandardMaterial({map:(()=>{const t=new T.CanvasTexture(signCanvas(label));t.encoding=T.sRGBEncoding;return t})(),roughness:.6}));
  sg.position.set(-1.6,2.45,6.115);G.add(sg);

  // çekirdek pencereleri (merdiven sahanlıkları)
  for(let i=0;i<NF;i++)win(B,S,0,Y0+i*FH+1.5+(i===0?.15:0),6.1,0,1.1,1.3,{});
  win(B,S,0,EAVE+1.3,6.1,0,1.1,1.5,{});
  // arka çekirdek pencereleri
  for(let i=0;i<NF;i++)win(B,S,0,Y0+i*FH+1.5,ZB-.1,Math.PI,1.1,1.3,{});
  win(B,S,0,EAVE+1.3,ZB-.1,Math.PI,1.1,1.5,{});

  // kanatlar
  for(const s of[-1,1]){
    // kalın yan duvarlar + boru
    for(const [x0,x1] of[[6.45,7.15],[12.9,13.6]])bxS(B,S.wall,s,x0,x1,.5,EAVE,ZF,ZF+1.5);
    for(const px of[6.4,13.55])cyl(B,S.wall,s*px,(EAVE+.5)/2,ZF+1.58,.06,.06,EAVE-.5);
    for(const [a,b2] of[[3.1,3.5],[6.05,6.45],[14.95,15.3]])bxS(B,S.accent,s,a,b2,.5,EAVE,ZF-.05,ZF+.14);
    bxS(B,S.accent,s,14.95,15.3,.5,EAVE,ZB-.25,ZB+.1);
    bxS(B,S.slab,s,7.15,12.9,EAVE-.5,EAVE,ZF,ZF+1.5);
    bxS(B,S.slab,s,13.6,15.3,EAVE-.4,EAVE,ZF,ZF+.9);
  }
  for(let i=0;i<NF;i++){
    const y0=Y0+i*FH;
    for(const s of[-1,1]){
      const wopt=()=>R()<(s>0?.3:.08)?{frame:S.metal}:{};
      win(B,S,s*4.8,y0+.95,ZF,0,1.3,1.4,wopt());
      for(const bxp of[5.2,9.2,13])win(B,S,s*bxp,y0+.9,ZB,Math.PI,1.3,1.4,{});
      
      for(const zz of[-4.1,-1.7,.7,3.1])win(B,S,s*WX,y0+.95,zz,s*Math.PI/2,.8,1.25,{});
      bxS(B,S.accent,s,WX,WX+.06,y0-.3,y0+.12,ZB,ZF);
      bxS(B,S.accent,s,-WX-.0,WX,y0-.3,y0+.12,ZB-.06,ZB);
      const xa=7.15,xb=12.9,enc=R()<.2;
      // loggia
      bxS(B,S.loggia,s,xa,xb,y0,y0+FH-.5,ZF,ZF+.03);
      bxS(B,S.slab,s,xa,xb,y0-.5,y0,ZF,ZF+1.5);
      bxS(B,S.bfloor,s,xa,xb,y0,y0+.015,ZF,ZF+1.5);
      for(let x=xa+.5;x<xb;x+=1.15)bxS(B,S.metal,s,x-.06,x+.06,y0-.6,y0-.5,ZF+1.3,ZF+1.46);
      win(B,S,s*8.4,y0+.85,ZF+.03,0,1.4,1.3,wopt());
      win(B,S,s*10.3,y0+.85,ZF+.03,0,1.4,1.3,wopt());
      win(B,S,s*12.15,y0,ZF+.03,0,.9,2.1,{door:true});
      // korkuluk
      bxS(B,S.rail,s,xa,xb,y0+.95,y0+1.0,ZF+1.4,ZF+1.47);
      bxS(B,S.rail,s,xa,xb,y0+.06,y0+.1,ZF+1.41,ZF+1.45);
      bxS(B,S.rail,s,xa,xb,y0+.5,y0+.53,ZF+1.42,ZF+1.45);
      for(let x=xa+.07;x<xb;x+=.11)bxS(B,S.rail,s,x-.011,x+.011,y0+.1,y0+.95,ZF+1.42,ZF+1.44);
      if(enc){
        bxS(B,S.glass,s,xa+.02,xb-.02,y0+1.0,y0+2.38,ZF+1.4,ZF+1.415);
        bxS(B,S.metal,s,xa,xb,y0+2.34,y0+2.4,ZF+1.38,ZF+1.43);
        for(let x=xa+.02;x<=xb-.01;x+=1.15)bxS(B,S.metal,s,x-.03,x+.03,y0+1.0,y0+2.4,ZF+1.38,ZF+1.43);
      }else if(opts.props){
        balconyProps(BP,BD,s,y0,xa,xb,ZF,R);
      }
      // dış bölüm (küçük balkon)
      bxS(B,S.slab,s,13.6,15.3,y0-.4,y0,ZF,ZF+.9);
      bxS(B,S.bfloor,s,13.6,15.3,y0,y0+.015,ZF,ZF+.9);
      win(B,S,s*14.5,y0+.85,ZF,0,.95,1.3,{});
      bxS(B,S.rail,s,13.6,15.3,y0+.95,y0+1.0,ZF+.82,ZF+.89);
      bxS(B,S.rail,s,13.6,15.3,y0+.06,y0+.1,ZF+.83,ZF+.87);
      for(let x=13.65;x<15.3;x+=.11)bxS(B,S.rail,s,x-.011,x+.011,y0+.1,y0+.95,ZF+.84,ZF+.86);
      if(R()<.55){
        const px=s*(13.9+R()*1.1),M1=new T.Matrix4().makeRotationX(Math.PI/2-.45);M1.setPosition(px,y0+1.35,ZF+.9);
        BD.add(new T.CylinderGeometry(.34,.06,.05,16),S.white,M1);
      }
    }
  }
  /* ----- çatı ----- */
  const yE=EAVE-.1,zE=6.05,hr=3,xa=3,xb=15.85,xr=xb-zE,L=Math.hypot(zE,hr);
  const nyy=zE/L,nzz=hr/L;
  const dmgMask=mulberry32(seed+7);
  for(const s of[-1,1]){
    const pt=(sz,u,v,off)=>{
      const bxx=xa+u*(xb-xa),txx=xa+u*(xr-xa),x=bxx+(txx-bxx)*v;
      return [s*x,yE+hr*v+off*nyy,sz*zE*(1-v)+sz*off*nzz,x];
    };
    const NU=10,NV=6;
    for(let i=0;i<NU;i++)for(let j=0;j<NV;j++){
      const u0=i/NU,u1=(i+1)/NU,v0=j/NV,v1=(j+1)/NV;
      const mk=()=>{
        const a=pt(1,u0,v0,.05),b=pt(1,u1,v0,.05),c=pt(1,u1,v1,.05),d=pt(1,u0,v1,.05);
        return [[a.slice(0,3),b.slice(0,3),c.slice(0,3),d.slice(0,3)],[[a[3],v0*L],[b[3],v0*L],[c[3],v1*L],[d[3],v1*L]]];
      };
      const nrm=[0,nyy,nzz];
      let [p,uv]=mk();quad(BT,S.roof,p,nrm,uv);
      const u=(u0+u1)/2,v=(v0+v1)/2;
      const rem=dmgMask()<(.2+.75*Math.sin(Math.PI*u)*(.4+.6*v)+(i>2&&i<8?.25:0));
      if(!rem){[p,uv]=mk();quad(BTD,S.roof,p,nrm,uv)}
    }
    // alt zemin (hasar görünümü)
    {const a=pt(1,0,0,-.02),b=pt(1,1,0,-.02),c=pt(1,1,1,-.02),d=pt(1,0,1,-.02);
     quad(BRF,S.deck,[a,b,c,d].map(q=>q.slice(0,3)),[0,nyy,nzz],[[a[3],0],[b[3],0],[c[3],L],[d[3],L]]);}
    // arka eğim
    {const a=pt(-1,0,0,.05),b=pt(-1,1,0,.05),c=pt(-1,1,1,.05),d=pt(-1,0,1,.05);

function blob(B,cx,cy,cz,rx,ry,rz,hex,sd,mat){
  const g=new T.SphereGeometry(1,18,13),p=g.attributes.position,n=p.count,col=new Float32Array(n*3),c=lin(hex);
  for(let i=0;i<n;i++){
    const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    const d=1+.12*Math.sin(x*4.1+sd)*Math.cos(z*3.3+sd*1.7)+.05*Math.sin(y*7+sd);
    p.setXYZ(i,x*d,y*d,z*d);
    const l=(.55+.45*(y*.5+.5))*(.85+.3*Math.abs(Math.sin(x*13+z*11+sd)));
    col[i*3]=c.r*l;col[i*3+1]=c.g*l;col[i*3+2]=c.b*l;
  }
  g.setAttribute('color',new T.BufferAttribute(col,3));g.computeVertexNormals();
  B.add(g,mat||LEAF,new T.Matrix4().makeTranslation(cx,cy,cz).multiply(new T.Matrix4().makeScale(rx,ry,rz)));
}

  'Arka':{th:Math.PI+.1,ph:1.35,r:56,t:[0,8,0]}
};
function goPre(n){const p=PRE[n];goal.th=p.th;goal.ph=p.ph;goal.r=p.r;goal.t.set(...p.t)}
const cams=$('cams');Object.keys(PRE).forEach(n=>{const b=document.createElement('button');b.className='btn';b.textContent=n;b.onclick=()=>goPre(n);cams.appendChild(b)});

const ptrs=new Map();let moved=0,downPos=null,lastPinch=0,lastMid=null;
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,b:e.button,sh:e.shiftKey});moved=0;downPos={x:e.clientX,y:e.clientY};if(ptrs.size===2){const a=[...ptrs.values()];lastPinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);lastMid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}}});
function pan(dx,dy){
  const k=goal.r*.0016,rx=Math.cos(goal.th),rz=-Math.sin(goal.th);
  goal.t.x-=dx*k*rx;goal.t.z-=dx*k*rz;goal.t.y=Math.max(0,Math.min(30,goal.t.y+dy*k));
}
canvas.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;moved+=Math.abs(dx)+Math.abs(dy);
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1){
    if(p.b===2||p.b===1||p.sh)pan(dx,dy);
    else{goal.th-=dx*.0052;goal.ph=Math.max(.12,Math.min(1.72,goal.ph-dy*.0045))}
  }else if(ptrs.size===2){
    const a=[...ptrs.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
    if(lastPinch)goal.r=Math.max(6,Math.min(220,goal.r*lastPinch/d));
    if(lastMid)pan(mid.x-lastMid.x,mid.y-lastMid.y);
    lastPinch=d;lastMid=mid;
  }
});
const ray=new T.Raycaster(),mouse=new T.Vector2();let pickables=[];
canvas.addEventListener('pointerup',e=>{
  ptrs.delete(e.pointerId);lastPinch=0;lastMid=null;
  if(moved<6&&downPos&&e.button===0)pick(e);
});
canvas.addEventListener('pointercancel',e=>ptrs.delete(e.pointerId));
canvas.addEventListener('wheel',e=>{e.preventDefault();goal.r=Math.max(6,Math.min(220,goal.r*Math.exp(e.deltaY*.0011)))},{passive:false});

/* ---------- arayüz ---------- */
const ROWS=[['wall','Duvar (ana cephe)'],['accent','Vurgu bantları / pilastrlar'],['slab','Balkon döşemeleri'],['fascia','Saçak / silme'],['roof','Çatı kiremiti'],['frame','Pencere & kapı doğrama'],['glass','Cam tonu'],['loggia','Balkon iç duvarı'],['rail','Balkon korkuluğu'],['base','Bina kaidesi (taş)'],['plinth','Çit bazı / bacalar'],['canopy','Giriş saçağı'],['fence','Çit demirleri'],['pillar','Çit sütunları'],['grass','Çim'],['nWall','Yan bina duvarı'],['nAccent','Yan bina vurgusu']];
const KEYS=ROWS.map(r=>r[0]);const NAME=Object.fromEntries(ROWS);
const rowsEl=$('rows'),inputs={},codes={};
ROWS.forEach(([k,label])=>{
  const row=document.createElement('div');row.className='row';row.id='row-'+k;
  const inp=document.createElement('input');inp.type='color';inp.id='in-'+k;inp.value=DEF[k];
  const lb=document.createElement('label');lb.htmlFor=inp.id;lb.textContent=label;
  const cd=document.createElement('code');cd.textContent=DEF[k];
  inp.addEventListener('input',()=>apply(k,inp.value));
  row.append(inp,lb,cd);rowsEl.appendChild(row);inputs[k]=inp;codes[k]=cd;
});
function apply(k,hex){
  setC(M[k],hex);inputs[k].value=hex;codes[k].textContent=hex;
  if(k==='roof'||k==='canopy'){/* kiremit renkleri ayrı */}
  if(k==='nWall'){}
}
function applyAll(p){for(const k of KEYS)if(p[k])apply(k,p[k])}
const PALS=[
 ['Orijinal',DEF],
 ['Antrasit · gri',{wall:'#cfd2d4',accent:'#3f444a',slab:'#2f3438',fascia:'#22262a',roof:'#555a61',frame:'#20242a',glass:'#2d3b47',rail:'#2b2f33',plinth:'#6b6f73',canopy:'#34383c',fence:'#1d2023',pillar:'#c9ccce',grass:'#6f8f4a'}],
 ['Krem · terrakota',{wall:'#efe3cc',accent:'#b8613f',slab:'#b8613f',fascia:'#6e3524',roof:'#a8472f',frame:'#fbf7ef',glass:'#41566a',rail:'#5a3a2a',plinth:'#c9b393',canopy:'#8a3a28',fence:'#3a2a20',pillar:'#efe3cc',grass:'#7f9a4c'}],
 ['Beyaz · mavi',{wall:'#f3f3ef',accent:'#3c6e9e',slab:'#2f5a85',fascia:'#25405c',roof:'#8c3b2a',frame:'#ffffff',glass:'#36546d',rail:'#274660',plinth:'#b9bbbd',canopy:'#2f5a85',fence:'#22364a',pillar:'#f3f3ef',grass:'#78994f'}],
 ['Adaçayı yeşili',{wall:'#d9dfcc',accent:'#6f8466',slab:'#5d7357',fascia:'#3f5239',roof:'#7a4a37',frame:'#f5f6f0',glass:'#40574f',rail:'#3a4a38',plinth:'#a9ac95',canopy:'#4e6449',fence:'#2c3a2b',pillar:'#e5e8da',grass:'#6f9448'}],
 ['Toprak · kahve',{wall:'#cdb594',accent:'#6b4a35',slab:'#5a3e2c',fascia:'#3d2a1e',roof:'#6e3f2c',frame:'#f0e8da',glass:'#3b4650',rail:'#3b2c22',plinth:'#8d7b63',canopy:'#4d3426',fence:'#2a211a',pillar:'#d9ccb6',grass:'#8b9a4e'}],
 ['Pastel şeftali',{wall:'#f4d9c4',accent:'#e9a58d',slab:'#e59a82',fascia:'#b5645a',roof:'#c8705a',frame:'#fffaf4',glass:'#4a5f70',rail:'#fbf1e6',plinth:'#cdb7a0',canopy:'#c25f4c',fence:'#4a3a35',pillar:'#f7e6d6',grass:'#86a458'}],
 ['Koyu modern',{wall:'#3b4046',accent:'#d8a24a',slab:'#c18f3c',fascia:'#1f2326',roof:'#2b2e32',frame:'#111315',glass:'#27323b',rail:'#16181a',plinth:'#2b2e31',canopy:'#1e2124',fence:'#0f1112',pillar:'#4c5157',grass:'#6a8a45'}]
];
const palEl=$('pal');
PALS.forEach(([n,p])=>{
  const b=document.createElement('button');b.className='chip';
  const sw=document.createElement('i');[p.wall,p.accent,p.roof].forEach(c=>{const s=document.createElement('s');s.style.background=c;sw.appendChild(s)});
  const t=document.createElement('span');t.textContent=n;b.append(sw,t);b.onclick=()=>applyAll(Object.assign({},DEF,p,n==='Orijinal'?{}:{nWall:inputs.nWall.value,nAccent:inputs.nAccent.value}));palEl.appendChild(b);
});
function hsl(h,s,l){return '#'+new T.Color().setHSL(((h%1)+1)%1,s,l).getHexString()}
$('rnd').onclick=()=>{
  const h=Math.random(),sc=[0,.5,.08,-.08,.33][(Math.random()*5)|0];
  const wl=.72+Math.random()*.18,al=.32+Math.random()*.26;
  const ah=h+sc+(Math.random()<.5?0:.5);
  applyAll({wall:hsl(h,.25+Math.random()*.4,wl),accent:hsl(ah,.3+Math.random()*.4,al),slab:hsl(ah,.3+Math.random()*.35,al-.06),fascia:hsl(ah,.35,.22),roof:hsl(.04+Math.random()*.04,.45,.38+Math.random()*.1),frame:hsl(h,.1,.94),rail:hsl(ah,.15,.2+Math.random()*.7),plinth:hsl(h,.2,.55),canopy:hsl(.03,.5,.36)});
};
$('reset').onclick=()=>applyAll(DEF);

const TG=[
 ['dmg','Çatı hasarı (fotoğraftaki gibi)',true,v=>blocks.forEach(b=>b.setDamage(v))],
 ['flag','Türk bayrakları',true,v=>mainBlock.flags.forEach(f=>f.visible=v)],
 ['dish','Uydu çanakları',true,v=>blocks.forEach(b=>b.dishes.visible=v)],
 ['prop','Balkon eşyaları',true,v=>blocks.forEach(b=>b.props.visible=v)],
 ['side','Yan bina',true,v=>sideBlock.group.visible=v],
 ['wire','Elektrik telleri',true,v=>scene.children.forEach(o=>{if(o.name==='wire')o.visible=v})],
 ['shad','Gölgeler',true,v=>{renderer.shadowMap.enabled=v;sun.castShadow=v;scene.traverse(o=>{if(o.material)o.material.needsUpdate=true})}],
 ['rot','Otomatik döndür',false,v=>autoRot=v]
];
let autoRot=false;
TG.forEach(([id,label,def,fn])=>{
  const d=document.createElement('label');d.className='tg';d.innerHTML=`<span>${label}</span><input type="checkbox" ${def?'checked':''}>`;
  d.querySelector('input').addEventListener('change',e=>fn(e.target.checked));$('tgs').appendChild(d);
});
let envT=0;
$('time').addEventListener('input',e=>{setTime(+e.target.value);clearTimeout(envT);envT=setTimeout(updateEnv,120)});
$('fold').onclick=()=>{const b=$('body');b.classList.toggle('hide');$('fold').textContent=b.classList.contains('hide')?'▸':'▾'};

const tip=$('tip');let tipT=0;
function showTip(t){tip.textContent=t;tip.style.opacity=1;clearTimeout(tipT);tipT=setTimeout(()=>tip.style.opacity=0,1800)}
function pick(e){
  const r=canvas.getBoundingClientRect();
  mouse.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(pickables,false);
  for(const h of hits){
    const mt=h.object.material,k=mt&&mt.userData&&mt.userData.key;
    if(k&&NAME[k]&&h.object.visible){
      const row=$('row-'+k);row.classList.add('flash');
      $('body').classList.remove('hide');$('fold').textContent='▾';
      row.scrollIntoView({block:'nearest',behavior:'smooth'});
      setTimeout(()=>row.classList.remove('flash'),1400);
      showTip('Seçilen: '+NAME[k]);return;
    }
  }
}

/* ---------- başlat ---------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
setTime(15.3);
blocks.forEach(b=>b.setDamage(true));
scene.updateMatrixWorld(true);
updateEnv();
scene.traverse(o=>{if(o.isMesh&&o.material&&o.material.userData&&o.material.userData.key&&!o.isInstancedMesh)pickables.push(o)});

const clock=new T.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.1),k=1-Math.exp(-dt*9);
  if(autoRot&&!ptrs.size)goal.th+=dt*.12;
  cur.th+=(goal.th-cur.th)*k;cur.ph+=(goal.ph-cur.ph)*k;cur.r+=(goal.r-cur.r)*k;cur.t.lerp(goal.t,k);
  const sp=Math.sin(cur.ph);
  camera.position.set(cur.t.x+cur.r*sp*Math.sin(cur.th),Math.max(1.8,cur.t.y+cur.r*Math.cos(cur.ph)),cur.t.z+cur.r*sp*Math.cos(cur.th));
  camera.lookAt(cur.t);
  sky.position.copy(camera.position);
  const tt=clock.elapsedTime;
  for(const f of mainBlock.flags){
    if(!f.visible)continue;
    const p=f.geometry.attributes.position,b=f.userData.base;
    for(let i=0;i<p.count;i++){const y=b[i*3+1],x=b[i*3];p.setZ(i,Math.sin(tt*2.2+y*1.8+x*2)*.07*(1-(y+2)/6)+Math.sin(tt*1.3+x*3)*.03)}
    p.needsUpdate=true;f.geometry.computeVertexNormals();
  }
  renderer.render(scene,camera);
}
loop();
$('load').style.opacity=0;setTimeout(()=>$('load').remove(),700);
window.__ready=true;
})();
</script>
